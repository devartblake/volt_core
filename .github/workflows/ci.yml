name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The tree is clean as of Phase 4 (0 errors, 0 warnings, 0 infos), so CI
      # now fails on anything new — including lints and deprecations, which is
      # how the previous 50-odd infos accumulated unnoticed.
      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Test
        run: flutter test

      # Catches web-only breakage (dart:io usage, conditional imports) that
      # analyze and the unit tests don't.
      - name: Build web
        run: flutter build web --no-tree-shake-icons
