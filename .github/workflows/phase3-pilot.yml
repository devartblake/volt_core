name: Phase 3 Pilot Certification

on:
  pull_request:
    paths:
      - '.github/workflows/phase3-pilot.yml'
      - 'lib/app/app_router.dart'
      - 'lib/core/constants/feature_flags.dart'
      - 'lib/core/constants/route_paths.dart'
      - 'lib/modules/dashboard/presenter/pages/tech_dashboard_page.dart'
      - 'lib/modules/templates/domain/services/generator_pilot_readiness.dart'
      - 'lib/modules/templates/domain/services/generator_pilot_resume.dart'
      - 'lib/modules/templates/presenter/pages/template_management_page.dart'
      - 'lib/modules/templates/presenter/pages/template_response_execution_page.dart'
      - 'lib/modules/templates/presenter/widgets/generator_pilot_drafts_panel.dart'
      - 'lib/modules/templates/presenter/widgets/generator_pilot_launch_panel.dart'
      - 'test/templates/generator_pilot_launch_panel_test.dart'
      - 'test/templates/generator_pilot_resume_test.dart'

jobs:
  pilot-flag-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify pilot flag and technician launch gate
        run: >-
          flutter test
          --dart-define=VOLTCORE_GENERATOR_TEMPLATE_PILOT=true
          test/templates/generator_pilot_launch_panel_test.dart
          test/templates/generator_pilot_resume_test.dart

      - name: Build flag-enabled pilot web
        run: >-
          flutter build web
          --no-tree-shake-icons
          --dart-define=VOLTCORE_GENERATOR_TEMPLATE_PILOT=true
