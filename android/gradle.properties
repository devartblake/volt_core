# Bound memory use on development machines running an IDE alongside the build.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx1G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m
android.useAndroidX=true
android.enableJetifier=true
# Retain legacy Kotlin support while Flutter plugins still apply kotlin-android.
android.builtInKotlin=false
# Flutter and those plugins still need AGP's legacy DSL with AGP 9.0.
android.newDsl=false
